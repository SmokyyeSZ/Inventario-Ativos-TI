<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 12" width="100%" height="12" fill="none">
  <defs>
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0" />
      <stop offset="45%" stop-color="#06b6d4" stop-opacity="0.9" />
      <stop offset="75%" stop-color="#ef4444" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0" />
    </linearGradient>
  </defs>
  <line x1="0" y1="6" x2="960" y2="6" stroke="#1e293b" stroke-width="1.2" />
  <rect x="-240" y="4.8" width="240" height="2.4" rx="1.2" fill="url(#pulseGrad)">
    <animate attributeName="x" from="-240" to="960" dur="5s" repeatCount="indefinite" />
  </rect>
</svg>

